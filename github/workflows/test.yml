name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend – Python tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            tesseract-ocr tesseract-ocr-kan \
            libgl1-mesa-glx libglib2.0-0

      - name: Install Python deps (CI subset – no heavy OCR engines)
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic openpyxl python-multipart \
                      numpy pillow opencv-python-headless pytesseract \
                      python-dotenv pytest pytest-timeout

      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -v --timeout=60

  frontend-validate:
    name: Frontend – TypeScript + Lint + Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ""
        run: npm run build
